name: ReplayBench-PG R1 - isolated-service fault pilot
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: r1-dist-${{ github.ref }}
  cancel-in-progress: false
jobs:
  distributed-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current source and experiment
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned host validator dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.2.6 pandas==2.3.3 PyYAML==6.0.3
      - name: Start three distinct HTTP service containers
        run: docker compose -f docker-compose.yml up -d --quiet-pull
      - name: Run actual ReplayBench-PG generic validator against isolated services
        run: python -m scripts.r1_dist_runner --output r1_distributed_results
      - name: Record topology, container images and logs
        if: always()
        run: |
          mkdir -p r1_distributed_results
          docker compose -f docker-compose.yml ps > r1_distributed_results/docker_services.txt || true
          docker compose -f docker-compose.yml images > r1_distributed_results/docker_images.txt || true
          docker compose -f docker-compose.yml logs --no-color --tail 200 > r1_distributed_results/service_logs.txt || true
          git rev-parse HEAD > r1_distributed_results/source_commit.txt
      - name: Upload aggregate and service evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-isolated-service-pilot-${{ github.run_id }}
          path: r1_distributed_results/
          if-no-files-found: error
          retention-days: 7
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.yml down --remove-orphans || true

