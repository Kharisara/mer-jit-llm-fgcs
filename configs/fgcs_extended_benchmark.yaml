# FGCS extended benchmark configuration
# Expected run count:
#   5 workloads x 4 policy modes x 3 seeds x 4 worker settings = 240 runs

dataset:
  # Minimal split-qualified replay input generated by scripts/prepare_primary_replay_v260.py.
  input_csv: paper_outputs/replay_input_v260.csv
  fractions: [0.10, 0.25, 0.50, 0.75, 1.00]
  identity_scheme: meld_split_qualified_source_record_id
  require_portable_paths: true
  touch_state_files: false

benchmark:
  # Three deterministic seeds.
  seeds: [1, 2, 3]

  # Four worker settings. Together with the settings above, this gives 240 runs.
  workers: [1, 2, 4, 8]

  # Final FGCS policy set. risk_proxy replaces the old all-zero proxy policy.
  policy_modes: [risk_proxy, random, always, never]

policy:
  # The active risk_proxy reads a frozen binary diagnostic control, not MELD labels.
  diagnostic_action_column: diagnostic_action
  random_intervention_probability: 0.50

fault_injection:
  # Disabled for the main clean FGCS 240-run experiment.
  enabled: false
  action_flip_probability: 0.0

  # Auxiliary faults are restricted to policies with eligible events.
  allowed_policy_modes: [risk_proxy, random, never]

generation_stub:
  mode: generic_service
  service_name: deterministic_policy_gated_stub
  record_id_column: source_record_id

logging:
  output_dir: paper_outputs/fgcs_extended_benchmark
  save_traces: true
  save_live_bc_predictions: false
